name: Release Please and publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      release-sha: ${{ steps.release.outputs.sha }}
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Generate bilingual release PR description with OpenRouter
        if: steps.release.outputs.prs_created == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemini-3.1-flash-lite' }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: python scripts/generate_bilingual_release_notes.py pr

      - name: Generate bilingual GitHub Release notes with OpenRouter
        if: steps.release.outputs.release_created == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemini-3.1-flash-lite' }}
          RELEASE_NOTES: ${{ steps.release.outputs.body }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: python scripts/generate_bilingual_release_notes.py release

  test:
    name: Test release
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    name: Build blackbone distributions
    needs: [release-please, test]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out released commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.release-sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build twine PyYAML

      - name: Generate JSON schemas
        run: python boneio/core/config/schema_converter.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Build package
        run: python -m build

      - name: Validate package metadata
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import glob
          from pathlib import Path

          artifacts = [Path(path).name for path in glob.glob("dist/*")]
          assert artifacts, "No distributions were built"
          assert all(name.startswith("blackbone-") for name in artifacts), artifacts
          print("Built:", ", ".join(sorted(artifacts)))
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ needs.release-please.outputs.release-version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish blackbone to PyPI
    needs: [release-please, build]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/blackbone/${{ needs.release-please.outputs.release-version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions-${{ needs.release-please.outputs.release-version }}
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
