name: Sync upstream repository

on:
  schedule:
    # Run daily at 08:00 UTC.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY || 'boneIO-eu/app_black' }}
  SOURCE_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'dev-debian13' }}
  TARGET_BRANCH: ${{ github.event.repository.default_branch }}
  UPSTREAM_SYNC_BATCH_SIZE: ${{ vars.UPSTREAM_SYNC_BATCH_SIZE || '25' }}

jobs:
  create-sync-pr:
    name: Create upstream sync PR
    runs-on: ubuntu-latest

    steps:
      - name: Check out target repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install sync tooling
        shell: bash
        run: pip install --quiet packaging PyYAML

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        shell: bash
        run: npm install -g pnpm@10

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid UPSTREAM_REPOSITORY: $SOURCE_REPOSITORY" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$SOURCE_BRANCH" == -* ]]; then
            echo "Invalid UPSTREAM_BRANCH: $SOURCE_BRANCH" >&2
            exit 1
          fi

      - name: Stop if another sync PR is open
        id: existing-pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          open_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$TARGET_BRANCH" \
            --state open \
            --json number,url,headRefName \
            --jq '[.[] | select(.headRefName | startswith("automation/upstream-sync/"))][0] // empty')

          if [[ -n "$open_pr" ]]; then
            pr_number=$(jq -r '.number' <<<"$open_pr")
            pr_url=$(jq -r '.url' <<<"$open_pr")
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "An upstream sync PR is already open: #${pr_number} (${pr_url})"
            echo "### Upstream sync skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "An earlier sync batch is still open: [#${pr_number}](${pr_url})." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream and select batch
        if: steps.existing-pr.outputs.skip != 'true'
        id: batch
        shell: bash
        run: |
          set -euo pipefail

          source_url="${GITHUB_SERVER_URL}/${SOURCE_REPOSITORY}.git"
          git remote add source "$source_url"
          git fetch --no-tags source "+refs/heads/${SOURCE_BRANCH}:refs/remotes/source/${SOURCE_BRANCH}"

          source_sha=$(git rev-parse "refs/remotes/source/${SOURCE_BRANCH}")
          state_file=.github/upstream-sync-state.json

          if [[ -f "$state_file" ]]; then
            state_repository=$(jq -er '.repository' "$state_file")
            state_branch=$(jq -er '.branch' "$state_file")
            base_sha=$(jq -er '.commit' "$state_file")

            if [[ "$state_repository" != "$SOURCE_REPOSITORY" ]] || [[ "$state_branch" != "$SOURCE_BRANCH" ]]; then
              echo "The sync state belongs to ${state_repository}:${state_branch}, not ${SOURCE_REPOSITORY}:${SOURCE_BRANCH}." >&2
              echo "Update or remove ${state_file} explicitly when changing the upstream source." >&2
              exit 1
            fi
            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid commit in ${state_file}: ${base_sha}." >&2
              exit 1
            fi
            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              echo "The recorded upstream commit does not exist: ${base_sha}." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$base_sha" "$source_sha"; then
              echo "Recorded commit ${base_sha} is not an ancestor of ${SOURCE_REPOSITORY}:${SOURCE_BRANCH}." >&2
              echo "The upstream branch may have been rewritten; review the sync state manually." >&2
              exit 1
            fi
          else
            # Bootstrap repositories that already share history with upstream.
            base_sha=$(git merge-base HEAD "$source_sha")
          fi

          # A run takes at most UPSTREAM_SYNC_BATCH_SIZE upstream first-parent
          # commits. Cutting only on the first-parent chain keeps a merge made
          # upstream atomic, and every included commit is enumerated in the PR
          # body below. The cap matters when digging out of a backlog; once the
          # fork is current, a daily batch is far smaller than it.
          pending_count=$(git rev-list --first-parent --count "${base_sha}..${source_sha}")

          if (( pending_count == 0 )); then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Target is already up to date with ${SOURCE_REPOSITORY}:${SOURCE_BRANCH}."
            echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
            echo "No new commits in \`${SOURCE_REPOSITORY}:${SOURCE_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          batch_size="${UPSTREAM_SYNC_BATCH_SIZE:-25}"
          if [[ ! "$batch_size" =~ ^[0-9]+$ ]] || (( batch_size < 1 )); then
            echo "Invalid UPSTREAM_SYNC_BATCH_SIZE: ${batch_size}" >&2
            exit 1
          fi

          if (( pending_count > batch_size )); then
            batch_end=$(git rev-list --first-parent --reverse "${base_sha}..${source_sha}" \
              | sed -n "${batch_size}p")
            echo "Capping this batch at ${batch_size} of ${pending_count} pending commits."
          else
            batch_end=$source_sha
          fi
          first_parent_count=$(git rev-list --first-parent --count "${base_sha}..${batch_end}")
          included_count=$(git rev-list --count "${base_sha}..${batch_end}")
          base_short=$(git rev-parse --short=12 "$base_sha")
          end_short=$(git rev-parse --short=12 "$batch_end")
          sync_branch="automation/upstream-sync/${base_short}-${end_short}"

          {
            echo "has_changes=true"
            echo "source_sha=$source_sha"
            echo "base_sha=$base_sha"
            echo "batch_end=$batch_end"
            echo "base_short=$base_short"
            echo "end_short=$end_short"
            echo "sync_branch=$sync_branch"
            echo "first_parent_count=$first_parent_count"
            echo "included_count=$included_count"
          } >> "$GITHUB_OUTPUT"

      - name: Apply selected upstream batch
        if: steps.batch.outputs.has_changes == 'true'
        id: apply
        env:
          BASE_SHA: ${{ steps.batch.outputs.base_sha }}
          BATCH_END: ${{ steps.batch.outputs.batch_end }}
          SYNC_BRANCH: ${{ steps.batch.outputs.sync_branch }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$SYNC_BRANCH"

          # Apply the net change for the exact source range instead of depending
          # on a particular GitHub merge strategy. The state file makes squash,
          # rebase and merge-commit PRs advance to the same next batch.
          #
          # The pipeline resolves everything .github/upstream-sync-policy.yml
          # claims, applies the rest file by file, and leaves genuine conflicts
          # in the tree with their markers. A conflict is a reviewable outcome,
          # not a failure, so this step exits 0 and the PR below is opened as a
          # draft instead.
          python -m scripts.upstream_sync.cli \
            --repo . \
            --base "$BASE_SHA" \
            --end "$BATCH_END" \
            --report-file "${RUNNER_TEMP}/upstream-sync-report.md" \
            --github-output "$GITHUB_OUTPUT"

          mkdir -p .github
          jq -n \
            --arg repository "$SOURCE_REPOSITORY" \
            --arg branch "$SOURCE_BRANCH" \
            --arg commit "$BATCH_END" \
            '{repository: $repository, branch: $branch, commit: $commit}' \
            > .github/upstream-sync-state.json
          # -A stages the conflicted files too, markers and all, so the draft
          # PR shows exactly what a human has to resolve.
          git add -A
          git commit \
            -m "chore(sync): upstream ${BASE_SHA:0:12}..${BATCH_END:0:12}" \
            -m "Source: ${SOURCE_REPOSITORY}:${SOURCE_BRANCH}" \
            -m "Range: ${BASE_SHA}..${BATCH_END} (from exclusive, to inclusive)"

      - name: Build exact PR description
        if: steps.batch.outputs.has_changes == 'true'
        env:
          BASE_SHA: ${{ steps.batch.outputs.base_sha }}
          BATCH_END: ${{ steps.batch.outputs.batch_end }}
          SOURCE_SHA: ${{ steps.batch.outputs.source_sha }}
          INCLUDED_COUNT: ${{ steps.batch.outputs.included_count }}
          FIRST_PARENT_COUNT: ${{ steps.batch.outputs.first_parent_count }}
        shell: bash
        run: |
          set -euo pipefail

          source_web_url="${GITHUB_SERVER_URL}/${SOURCE_REPOSITORY}"
          compare_url="${source_web_url}/compare/${BASE_SHA}...${BATCH_END}"

          {
            echo '<!-- upstream-sync-metadata'
            echo "source_repository=${SOURCE_REPOSITORY}"
            echo "source_branch=${SOURCE_BRANCH}"
            echo "from_exclusive=${BASE_SHA}"
            echo "to_inclusive=${BATCH_END}"
            echo "source_tip_when_created=${SOURCE_SHA}"
            echo '-->'
            echo
            echo '## Upstream sync batch'
            echo
            echo '| Field | Exact value |'
            echo '| --- | --- |'
            echo "| Source | [\`${SOURCE_REPOSITORY}:${SOURCE_BRANCH}\`](${source_web_url}/tree/${SOURCE_BRANCH}) |"
            echo "| Range | \`${BASE_SHA}..${BATCH_END}\` (from exclusive, to inclusive) |"
            echo "| Compare | [View the exact source diff](${compare_url}) |"
            echo "| Source tip at creation | \`${SOURCE_SHA}\` |"
            echo "| Included source commits | ${INCLUDED_COUNT} (${FIRST_PARENT_COUNT} on the first-parent chain) |"
            echo '| Tracking | `.github/upstream-sync-state.json` advances to the inclusive end SHA |'
            echo
            echo '### Included source commits'
            echo
          } > upstream-sync-pr.md

          while IFS=$'\t' read -r commit_sha subject; do
            escaped_subject=${subject//|/\\|}
            echo "- [\`${commit_sha}\`](${source_web_url}/commit/${commit_sha}) ${escaped_subject}" >> upstream-sync-pr.md
          done < <(git log --reverse --format='%H%x09%s' "${BASE_SHA}..${BATCH_END}")

          {
            echo
            echo '## What the sync resolved automatically'
            echo
            cat "${RUNNER_TEMP}/upstream-sync-report.md"
            echo
            echo '---'
            echo 'This PR was generated automatically. Merge it before the next batch is opened.'
          } >> upstream-sync-pr.md

      - name: Push branch and create pull request
        if: steps.batch.outputs.has_changes == 'true'
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ steps.batch.outputs.sync_branch }}
          BASE_SHORT: ${{ steps.batch.outputs.base_short }}
          END_SHORT: ${{ steps.batch.outputs.end_short }}
          NEEDS_HUMAN: ${{ steps.apply.outputs.needs_human }}
          CONFLICT_COUNT: ${{ steps.apply.outputs.conflict_count }}
          UNAPPLIED_COUNT: ${{ steps.apply.outputs.unapplied_count }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            echo "Branch ${SYNC_BRANCH} already exists; refusing to overwrite it." >&2
            exit 1
          fi

          git push origin "HEAD:refs/heads/${SYNC_BRANCH}"

          # A batch needing a human is opened as a draft and labelled, so the
          # "Stop if another sync PR is open" guard above pauses the schedule
          # until someone resolves it. It is never a silent failure again.
          draft_args=()
          title="chore(sync): upstream ${BASE_SHORT}..${END_SHORT}"
          if [[ "$NEEDS_HUMAN" == "true" ]]; then
            draft_args+=(--draft --label upstream-sync-conflict)
            title="${title} [conflicts]"
            gh label create upstream-sync-conflict \
              --repo "$GITHUB_REPOSITORY" \
              --color d93f0b \
              --description "Upstream sync batch that needs manual resolution" \
              --force >/dev/null 2>&1 || true
          fi

          pr_url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$TARGET_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "$title" \
            --body-file upstream-sync-pr.md \
            "${draft_args[@]}")

          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          if [[ "$NEEDS_HUMAN" == "true" ]]; then
            echo "### Upstream sync PR needs a human" >> "$GITHUB_STEP_SUMMARY"
            echo "${CONFLICT_COUNT} conflict(s), ${UNAPPLIED_COUNT} unapplied." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Upstream sync PR created" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "${pr_url}" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Exact source range: \`${{ steps.batch.outputs.base_sha }}..${{ steps.batch.outputs.batch_end }}\`." >> "$GITHUB_STEP_SUMMARY"

      # A conflict opens a draft PR above and is not a failure. Reaching here
      # means something genuinely broke: a malformed policy, a rewritten
      # upstream history, or regeneration falling over. Six such failures went
      # unnoticed before this existed, so give the failure a mouth.
      - name: Report a blocked sync
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          title="Upstream sync blocked"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf '%s\n' \
            "The scheduled upstream sync failed for a reason the policy could not absorb." \
            "" \
            "- Run: ${run_url}" \
            "- Source: \`${SOURCE_REPOSITORY}:${SOURCE_BRANCH}\`" \
            "" \
            "A conflicting batch would have opened a draft pull request instead, so this is" \
            "a genuine error: a malformed policy, rewritten upstream history, or lockfile" \
            "regeneration failing." \
            "" \
            "This issue is reused; the sync stays broken until it is closed.")

          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body"
          fi
